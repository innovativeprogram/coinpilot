<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2.0.0/dist/streamlit-component-lib.umd.min.js"></script>
</head>
<body>
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }
        
        let userId = getCookie('coinpilot_user_id');
        if (!userId) {
            userId = Math.random().toString(36).substr(2, 12);
            setCookie('coinpilot_user_id', userId, 365);
        }
        
        Streamlit.setComponentValue(userId);
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (event) => {
            Streamlit.setComponentValue(userId);
        });
        Streamlit.setFrameHeight(0);
    </script>
</body>
</html>
